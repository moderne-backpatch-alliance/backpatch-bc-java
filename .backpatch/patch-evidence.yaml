  note: "the full suite at the tested commit, 76 tests run, 0 failed, 0 skipped; test JVMs: Zulu 6u42, the Java 6 of the release's era (CertTest compares BC's certificate hashCode with the JDK's, which changed after 7u79), with unlimited JCE policy jars (12 cipher tests need key sizes the default policy refuses); -Duser.timezone=Australia/Melbourne (CertPathValidatorTest and CertPathBuilderTest build their 2008-09-04 validation date in local time, and their CRLs are valid 04:45-07:31 UTC that day); BC registered as a static provider through -Djava.security.properties (the openssl AllTests' PKCS8 tests ask for provider BC and otherwise find it only when testOpenSSL ran first); ReaderTest's five PEM files (test.pem, eckey.pem, enckey.pem, pkcs7.pem, pkcs8test.pem), which the 1.46 source tree lacks, are bc-java's from its first git import 158b54fba (2013-02-08, a CVS import whose CVS/Entries date them 2005-2010, before 1.46), on the test class path; the 72 openssl test data files the 1.46 tree has are byte-identical to that import's; the regression tests for CVE-2026-59650 are DHTest"
