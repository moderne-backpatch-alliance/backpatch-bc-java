    note: Carried from 1.47.1-backpatch-00003; ported onto 1.47; fixed at 1.47.1-backpatch-00003 (backpatch-bc-java@eecbbad). bcprov now accepts only exact DER for DSA and ECDSA signatures and refuses non-minimally encoded ASN.1 INTEGER and ENUMERATED values wherever it parses them (CVE-2016-1000338, CVE-2016-1000342). If your app verifies DSA or ECDSA signatures from a signer that emits BER or pads its integers, `Signature.verify` throws `SignatureException("error decoding signature bytes.")`; if it parses certificates, CRLs or time-stamp responses whose integers carry a redundant leading `00` or `FF` octet, parsing fails with `ASN1Exception("corrupted stream detected")` caused by `IllegalArgumentException("malformed integer")`. This release has no setting to relax either check, so the data has to be produced as correct DER by the signer or issuer. Re-encoding a signature to DER yourself before calling `verify` gets it through, but brings back the signature malleability the fix closes.
  - cve: CVE-2016-1000342
