  commit: 1d4702c171bc7fe89a65a9d49afd6fc25308d28e
  command: javac of Zulu 7u55 (-source/-target 1.5) over the release's source set, then ant junit (Apache Ant 1.9.16) over the ProviderRegressionSuite and the AllTests suites (bc-1.46-suite.xml) on Zulu 6u42 in a linux/amd64 container, through <alliance>/work/wave2/batch-4/green-suites/scripts/bc-1.46.sh suite with TEST_SECURITY=<alliance>/work/wave2/batch-4/green-suites/scripts/bc-1.46-static-provider.security and TEST_RESOURCES=<alliance>/work/wave2/batch-4/green-suites/scripts/bc-1.46-test-resources
  runtime: Azul Zulu (Java 1.6.0_42, Linux x64, with Zulu 7u181's unlimited JCE policy jars) running the tests, Apache Ant 1.9.16, in a linux/amd64 debian:bookworm-slim container on macOS aarch64
  report: bcprov-jdk15-1.46.1-backpatch-00025-tests.zip
  report_sha256: 25284ee08c99937db2c1037c4e72160f22a96a707bab2959a1bcbe9bc3e0aa6e
  result: pass
  note: "the full suite at the tested commit, 76 tests run, 0 failed, 0 skipped; test JVMs: Zulu 6u42, the Java 6 of the release's era (CertTest compares BC's certificate hashCode with the JDK's, which changed after 7u79), with unlimited JCE policy jars (12 cipher tests need key sizes the default policy refuses); -Duser.timezone=Australia/Melbourne (CertPathValidatorTest and CertPathBuilderTest build their 2008-09-04 validation date in local time, and their CRLs are valid 04:45-07:31 UTC that day); BC registered as a static provider through -Djava.security.properties (the openssl AllTests' PKCS8 tests ask for provider BC and otherwise find it only when testOpenSSL ran first); ReaderTest's five PEM files (test.pem, eckey.pem, enckey.pem, pkcs7.pem, pkcs8test.pem), which the 1.46 source tree lacks, are bc-java's from its first git import 158b54fba (2013-02-08, a CVS import whose CVS/Entries date them 2005-2010, before 1.46), on the test class path; the 72 openssl test data files the 1.46 tree has are byte-identical to that import's; the regression tests for CVE-2026-8763 are PKIXNameConstraintsTest"
