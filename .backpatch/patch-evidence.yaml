fixes:
  - cve: CVE-2013-1624
    upstream_fix_url: https://github.com/advisories/GHSA-8353-fgcr-xfhx
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2013-1624
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-bc-java/compare/5a6c271~1...538cb37
    basis: adapted
    artifacts:
      - org.bouncycastle:bcprov-jdk15on
    note: Carried from 1.47.1-backpatch-00001; ported onto 1.47; fixed at 1.47.1-backpatch-00001 (backpatch-bc-java@5a6c271..538cb37). Unlike Bouncy Castle's own bcprov jars on Maven Central, this jar does not carry Bouncy Castle's JCE code-signing signature, which a rebuilt jar cannot reproduce. If your application registers the Bouncy Castle provider (with `Security.addProvider` or in `java.security`) and runs on an Oracle JDK, asking it for a `Cipher`, `KeyAgreement`, `KeyGenerator`, `Mac` or `SecretKeyFactory` fails with an exception whose message is `JCE cannot authenticate the provider BC`, and a request that names no provider passes over it. OpenJDK builds accept the unsigned provider. To keep using it, run on an OpenJDK build, or call Bouncy Castle's lightweight API (`org.bouncycastle.crypto`) directly instead of going through the JCE provider.
  - cve: CVE-2015-7940
    upstream_fix_url: https://github.com/advisories/GHSA-4mv7-cq75-3qjm
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2015-7940
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-bc-java/commit/cac25cf
    basis: adapted
    artifacts:
      - org.bouncycastle:bcprov-jdk15on
    note: Carried from 1.47.1-backpatch-00002; ported onto 1.47; fixed at 1.47.1-backpatch-00002 (backpatch-bc-java@cac25cf).
  - cve: CVE-2016-1000338
    upstream_fix_url: https://github.com/advisories/GHSA-4vhj-98r6-424h
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2016-1000338
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-bc-java/commit/eecbbad
    basis: adapted
    artifacts:
      - org.bouncycastle:bcprov-jdk15on
    note: Carried from 1.47.1-backpatch-00003; ported onto 1.47; fixed at 1.47.1-backpatch-00003 (backpatch-bc-java@eecbbad). bcprov now accepts only exact DER for DSA and ECDSA signatures and refuses non-minimally encoded ASN.1 INTEGER and ENUMERATED values wherever it parses them (CVE-2016-1000338, CVE-2016-1000342). If your app verifies DSA or ECDSA signatures from a signer that emits BER or pads its integers, `Signature.verify` throws `SignatureException("error decoding signature bytes.")`; if it parses certificates, CRLs or time-stamp responses whose integers carry a redundant leading `00` or `FF` octet, parsing fails with `ASN1Exception("corrupted stream detected")` caused by `IllegalArgumentException("malformed integer")`. This release has no setting to relax either check, so the data has to be produced as correct DER by the signer or issuer. Re-encoding a signature to DER yourself before calling `verify` gets it through, but brings back the signature malleability the fix closes.
